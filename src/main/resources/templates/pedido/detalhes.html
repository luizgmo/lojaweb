<!DOCTYPE html>
<html>
	<head>
		<title>Loja Web</title>
		<meta charset="UTF-8">
	</head>

	<body>
		<h1>Loja Web</h1>

		<h2>Pedido #<span th:text="${pedido.id}"></span></h2>		
		<p><strong>Cliente:</strong> <span th:text="${pedido.cliente.nome}"></span></p>

		<table border="1">
			<tr>
				<th>Item</th>
				<th>Descrição</th>
				<th>Quantidade</th>
				<th>Preço Unitário</th>
			</tr>

			<tr th:each="item : ${itens}">
				<td th:text="${item.id}"></td>
				<td th:text="${item.produto.descricao}"></td>
				<td th:text="${item.quantidade}"></td>
				<td th:text="${#numbers.formatDecimal(item.produto.preco, 1, 2, 'COMMA')}"></td>
			</tr>

		</table>

	</body>
</html>
